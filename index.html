<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https:; img-src * data: blob:; media-src * data: blob:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; connect-src * data: blob:; frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://*.stripe.com;" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>MeliusMe — Private, Local-First Meal &amp; Nutrition Tracker</title>
    <meta
      name="description"
      content="MeliusMe is a privacy-first nutrition tracker: log meals by photo, track calories, macros and water, and keep streaks — all stored encrypted on your own device. No account, no ads."
    />
    <meta name="author" content="MeliusMe" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="MeliusMe" />
    <meta name="apple-mobile-web-app-title" content="MeliusMe" />

    <!-- TODO (external step): Google Search Console verification.
         Add a meta tag named "google-site-verification" here with the token
         Google generates for this property, or verify via DNS. No placeholder
         tag is shipped, because an invalid token would fail verification. -->

    <!-- Canonical is set per route at runtime by src/components/RouteHead.tsx:
         the public landing page gets a self-referencing canonical, private app
         routes get noindex, nofollow and no canonical. -->

    <meta property="og:site_name" content="MeliusMe" />
    <meta property="og:title" content="MeliusMe — Private, Local-First Meal &amp; Nutrition Tracker" />
    <meta
      property="og:description"
      content="Log meals by photo and track calories, macros, water and streaks. Your data stays encrypted on your device — no account, no ads."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meliusme.lovable.app/" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MeliusMe — Private, Local-First Meal &amp; Nutrition Tracker" />
    <meta
      name="twitter:description"
      content="Log meals by photo and track calories, macros, water and streaks. Your data stays encrypted on your device — no account, no ads."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://meliusme.lovable.app/#organization",
            "name": "MeliusMe",
            "url": "https://meliusme.lovable.app/",
            "logo": "https://meliusme.lovable.app/icons/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://meliusme.lovable.app/#website",
            "name": "MeliusMe",
            "url": "https://meliusme.lovable.app/",
            "inLanguage": "en",
            "publisher": { "@id": "https://meliusme.lovable.app/#organization" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://meliusme.lovable.app/#app",
            "name": "MeliusMe",
            "url": "https://meliusme.lovable.app/",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "Web browser, Android",
            "browserRequirements": "Requires JavaScript and IndexedDB",
            "inLanguage": "en",
            "description": "Privacy-first, local-first meal and nutrition tracker. Log meals by photo and track calories, macros, water and streaks, with data stored encrypted on the user's own device.",
            "featureList": [
              "Photo-based meal logging",
              "Calorie and macro tracking",
              "Water tracking",
              "Streaks, levels and daily challenges",
              "CSV export of your own data",
              "Offline, local-first storage"
            ],
            "publisher": { "@id": "https://meliusme.lovable.app/#organization" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
